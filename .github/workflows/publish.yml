name: Publish to GitHub Pages

# Build the two course books and deploy to GitHub Pages.
#
# IMPORTANT — execution model:
#   Code in the books is executed LOCALLY by the author (via `quarto render`)
#   and the results are cached in each book's `_freeze/` folder, which IS
#   committed to git. This workflow therefore does NOT run Python — it only
#   re-assembles the already-frozen HTML. That keeps CI fast and avoids
#   installing heavy libraries (geopandas, bertopic, torch, ...) in the runner.
#
#   => Always run `quarto render` locally and commit `_freeze/` before pushing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Build the combined site into ./_site, with each course in a subfolder.
      # Because of `freeze: auto` + committed _freeze/, no Python is executed here.
      - name: Render DATS 6401 book
        run: quarto render dats6401 --output-dir ../_site/dats6401

      # When DATS 2102 is added, uncomment:
      # - name: Render DATS 2102 book
      #   run: quarto render dats2102 --output-dir ../_site/dats2102

      - name: Copy landing page
        run: cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
