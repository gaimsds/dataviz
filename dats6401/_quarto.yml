project:
  type: book
  output-dir: _book
  resources:
    - weekly/      # per-week notebooks and data, served as linked downloads

# IMPORTANT: freeze means code is executed LOCALLY (when you run `quarto render`)
# and the computed results are cached in _freeze/ and committed to git.
# The GitHub Action then just assembles the frozen HTML — it never runs Python in CI.
# This keeps the build fast and avoids installing heavy libs (geopandas, bertopic) in the runner.
execute:
  freeze: auto

# Pin the kernel. Without this, Quarto auto-discovers a Python kernelspec and can
# pick a stale one (a kernel whose conda env has since been deleted), which fails
# the render with a confusing FileNotFoundError.
jupyter: python3

book:
  title: "Visualization of Complex Data"
  subtitle: "DATS 6401 — Graduate Course"
  author: "Junjun Yin"
  date: today
  search: true
  repo-url: https://github.com/gaimsds/dataviz
  repo-actions: [edit, issue]
  page-footer:
    left: "DATS 6401 · George Washington University"
    right: "Built with [Quarto](https://quarto.org)"
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - week_01_foundations_setup.qmd
        - week_02_grammar_design_principles.qmd
        - week_03_tabular_multivariate.qmd
        - week_04_time_series.qmd
    - part: "Interactive Apps & Complex Modalities"
      chapters:
        - week_05_streamlit_apps.qmd
        - week_06_graph_network_data.qmd
        - week_07_text_data.qmd
        - week_08_image_data.qmd
        - week_09_map_visualization_i.qmd
        - week_10_map_visualization_ii.qmd
    - part: "Client–Server & Machine Learning"
      chapters:
        - week_11_consuming_apis.qmd
        - week_12_serving_models_fastapi.qmd
        - week_13_ml_nlp_visualization.qmd
        - week_14_deployment_ethics_workshop.qmd

format:
  html:
    theme:
      - cosmo
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    number-sections: false
  # PDF output is optional — uncomment to also build a PDF book.
  # Requires a TeX install (`quarto install tinytex`). Note: executable
  # weeks render fine; embedded live-app iframes won't appear in PDF.
  # pdf:
  #   documentclass: scrbook
